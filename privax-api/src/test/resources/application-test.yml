# Test profile: an in-memory H2 database, so integration tests are self-contained
# and never touch the real PostgreSQL development database.
spring:
  datasource:
    url: jdbc:h2:mem:privaxtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
app:
  cors:
    allowed-origins: http://localhost:3000
logging:
  level:
    org.springframework.security: WARN
