spring:
  application:
    name: covid-api
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    # Credentials come from the environment; the defaults after ':' are for local dev only.
    # In any shared/production environment set DB_URL / DB_USERNAME / DB_PASSWORD instead.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/privaxdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    # Keep Spring Security at INFO — DEBUG logs the authenticated principal on every request,
    # which leaks usernames, emails and password hashes into the logs. Raise to DEBUG only
    # for local troubleshooting, never in a shared/production environment.
    org.springframework.security: INFO
    # org.hibernate.SQL: DEBUG
