<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Privax favicon — path-based for guaranteed cross-browser rendering -->

  <!-- Rounded navy background -->
  <rect width="64" height="64" rx="12" fill="#0F1A2E"/>

  <!-- Soft cyan glow under the dot -->
  <circle cx="48" cy="48" r="13" fill="#4FB6D9" opacity="0.18"/>

  <!-- Outer "P" shape (filled in glow-white) -->
  <path d="M10 12 L10 52 L20 52 L20 36 L31 36 C40 36 46 31 46 24 C46 17 40 12 31 12 Z"
        fill="#E5F1F8"/>
  <!-- Inner hole of the "P" (filled with navy to cut through) -->
  <path d="M20 20 L20 28 L30 28 C34 28 36 26.5 36 24 C36 21.5 34 20 30 20 Z"
        fill="#0F1A2E"/>

  <!-- The brand dot — the signature period from "Privax." -->
  <circle cx="50" cy="48" r="7" fill="#4FB6D9"/>
  <circle cx="50" cy="48" r="9.5" fill="none" stroke="#4FB6D9" stroke-opacity="0.55" stroke-width="1.4"/>
</svg>
