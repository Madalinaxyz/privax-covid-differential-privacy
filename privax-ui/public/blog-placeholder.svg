<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#091E2E"/>
      <stop offset="55%" stop-color="#0F2D45"/>
      <stop offset="100%" stop-color="#1A4D6E"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="72%" cy="58%" r="42%">
      <stop offset="0%"  stop-color="#4FB6D9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4FB6D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="18%" cy="22%" r="35%">
      <stop offset="0%"  stop-color="#2DA597" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2DA597" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="52%" r="28%">
      <stop offset="0%"  stop-color="#4FB6D9" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#4FB6D9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4FB6D9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#cyanGlow)"/>
  <rect width="1200" height="675" fill="url(#mintGlow)"/>
  <rect width="1200" height="675" fill="url(#centerGlow)"/>

  <!-- Constellation -->
  <g stroke="#4FB6D9" stroke-opacity="0.14" stroke-width="0.8" fill="none">
    <line x1="180" y1="200" x2="350" y2="160"/>
    <line x1="350" y1="160" x2="450" y2="230"/>
    <line x1="450" y1="230" x2="280" y2="340"/>
    <line x1="280" y1="340" x2="180" y2="500"/>
    <line x1="180" y1="500" x2="320" y2="560"/>
    <line x1="780" y1="200" x2="920" y2="170"/>
    <line x1="920" y1="170" x2="1050" y2="280"/>
    <line x1="1050" y1="280" x2="970" y2="450"/>
    <line x1="970" y1="450" x2="850" y2="530"/>
    <line x1="850" y1="530" x2="700" y2="560"/>
  </g>

  <g fill="#4FB6D9" opacity="0.85">
    <circle cx="180" cy="200" r="2.8"/>
    <circle cx="350" cy="160" r="2.4"/>
    <circle cx="450" cy="230" r="3.2"/>
    <circle cx="280" cy="340" r="2.4"/>
    <circle cx="180" cy="500" r="2.6"/>
    <circle cx="320" cy="560" r="2.2"/>
    <circle cx="780" cy="200" r="2.6"/>
    <circle cx="920" cy="170" r="3"/>
    <circle cx="1050" cy="280" r="2.4"/>
    <circle cx="970" cy="450" r="2.8"/>
    <circle cx="850" cy="530" r="2.4"/>
    <circle cx="700" cy="560" r="2.6"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="80"   cy="80"  r="1.2" opacity="0.55"/>
    <circle cx="220"  cy="620" r="1.4" opacity="0.5"/>
    <circle cx="550"  cy="80"  r="1"   opacity="0.45"/>
    <circle cx="1090" cy="120" r="1.2" opacity="0.5"/>
    <circle cx="1110" cy="450" r="1.4" opacity="0.45"/>
    <circle cx="640"  cy="610" r="1"   opacity="0.5"/>
    <circle cx="380"  cy="80"  r="0.9" opacity="0.45"/>
    <circle cx="880"  cy="100" r="1.1" opacity="0.5"/>
    <circle cx="60"   cy="380" r="1"   opacity="0.45"/>
    <circle cx="1140" cy="600" r="1.1" opacity="0.5"/>
  </g>

  <!-- ──────────────────────────────────────────────────────────
       CENTERED "P." MARK
       The "P" uses SVG <text> rendered with the system's bold sans-serif.
       The dot is a separate circle for predictable styling + halo.
       Positioned so the P+dot pair feels balanced around horizontal center.
       ────────────────────────────────────────────────────────── -->

  <!-- Big "P" — shifted slightly left of center to make room for the dot -->
  <text x="568" y="455"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, system-ui, Helvetica, Arial, sans-serif"
        font-size="330"
        font-weight="900"
        letter-spacing="-12"
        fill="#E5F1F8">P</text>

  <!-- The brand dot, placed at the bottom-right of the P like the wordmark "Privax." -->
  <circle cx="688" cy="442" r="24" fill="#4FB6D9"/>
  <circle cx="688" cy="442" r="33"
          fill="none" stroke="#4FB6D9" stroke-opacity="0.5" stroke-width="2.5"/>
</svg>
